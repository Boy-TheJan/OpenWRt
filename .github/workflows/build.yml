name: Build OpenWrt J4125
on:
  workflow_dispatch:

env:
  OWRT_DIR: openwrt
  OWRT_BRANCH: main
  SWAP_FILE: ./swapfile

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison quilt libssl-dev unzip git wget python3 python3-setuptools file rsync

      - name: Create swap file in workspace（工作目录，不再使用/swapfile）
        run: |
          dd if=/dev/zero of=${{ env.SWAP_FILE }} bs=1G count=8 status=none
          sudo chmod 600 ${{ env.SWAP_FILE }}
          sudo mkswap ${{ env.SWAP_FILE }}
          sudo swapon ${{ env.SWAP_FILE }}

      - name: Clone OpenWrt Official Source
        run: |
          git clone https://github.com/openwrt/openwrt.git ${{ env.OWRT_DIR }}
          cd ${{ env.OWRT_DIR }}
          git checkout ${{ env.OWRT_BRANCH }}

      - name: Embed LuCI default Chinese config
        run: |
          mkdir -p ${{ env.OWRT_DIR }}/files/etc/config
          {
            echo "config core 'main'"
            echo "        option lang 'zh-cn'"
            echo "        option mediaurlbase '/luci-static/bootstrap/'"
            echo "        option theme 'bootstrap'"
          } > ${{ env.OWRT_DIR }}/files/etc/config/luci

      - name: Load feeds and build config
        run: |
          cp feeds.conf.default ${{ env.OWRT_DIR }}/
          cp .config ${{ env.OWRT_DIR }}/
          cd ${{ env.OWRT_DIR }}
          sed -i 's/dnsmasq \\/dnsmasq-full \\/' include/target.mk
          rm -rf feeds package/feeds
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Fetch source archives
        run: |
          cd ${{ env.OWRT_DIR }}
          make download -j$(nproc)

      - name: Compile firmware image
        run: |
          cd ${{ env.OWRT_DIR }}
          make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-J4125-x86_64
          path: ${{ env.OWRT_DIR }}/bin/targets/x86/64/
