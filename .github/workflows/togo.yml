name: 构建 x86_64 中文 IPv6 固件（加速版）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 安装依赖（已用 python3-setuptools 代替 python3-distutils，并加入 ccache）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-dev python3-pip python3-setuptools rsync unzip zlib1g-dev file wget ccache

      # 2. 配置 ccache
      - name: 配置 ccache
        run: |
          ccache -M 5G
          ccache -s
          echo "CCACHE_DIR=${HOME}/.ccache" >> $GITHUB_ENV
          echo "CACHE_KEY_PREFIX=openwrt-x86-$(date +%Y%m)" >> $GITHUB_ENV

      # 3. 克隆源码
      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt

      # 4. 更新 feeds
      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 生成定制 .config（含 ccache 选项）
      - name: 生成定制化配置
        working-directory: openwrt
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_VMDK_IMAGES=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_IPV6=y
          CONFIG_KERNEL_IPV6=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      # 6. 预设中文默认语言和时区（使用 files 目录自动打包）
      - name: 预设中文界面
        working-directory: openwrt
        run: |
          mkdir -p files/etc/config
          cat > files/etc/config/luci <<EOF
          config core 'main'
              option lang 'zh_cn'
          EOF
          mkdir -p files/etc
          echo "Asia/Shanghai" > files/etc/TZ
          # OpenWrt 会自动包含 files 目录，无需在 .config 中额外设置

      # 7. 缓存恢复（必须在 .config 和 feeds 生成之后，才能正确计算哈希）
      - name: 恢复 dl 下载缓存和 ccache 编译缓存
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ${{ env.CCACHE_DIR }}
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('openwrt/.config', 'openwrt/feeds.conf.default') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-

      # 8. 开始编译
      - name: 编译固件（使用 ccache）
        working-directory: openwrt
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(nproc) V=s

      # 9. 收集固件
      - name: 收集固件
        if: success()
        run: |
          mkdir -p firmware
          cp openwrt/bin/targets/x86/64/*.img.gz firmware/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*.vmdk firmware/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*.iso firmware/ 2>/dev/null || true
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      # 10. 上传产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-zh_CN-IPv6-${{ env.BUILD_DATE }}
          path: firmware/
