name: Build OpenWrt MAIN J4125
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  OPENWRT_BRANCH: main
  FIRMWARE_TAG: J4125-I225V
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ binutils flex bison gawk autoconf automake libtool ccache libncurses-dev git curl wget unzip rsync python3-pip libssl-dev qemu-utils

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch ${{ env.OPENWRT_BRANCH }} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          cp feeds.conf.default feeds.conf

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ env.FIRMWARE_TAG }}-${{ github.sha }}
        env:
          CCACHE_DIR: openwrt/.ccache

      - name: Source code performance tuning
        run: |
          cd openwrt
          echo "==== Start performance tuning ===="

          # kernel config x86_64 config‑6.6
          KCFG=target/linux/x86/config-6.6
          echo 'CONFIG_TCP_CONG_BBR=y' >> $KCFG
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> $KCFG
          echo 'CONFIG_TCP_FASTOPEN=y' >> $KCFG
          echo 'CONFIG_VM_SWAPPINESS=10' >> $KCFG
          echo 'CONFIG_NF_FLOW_TABLE=y' >> $KCFG
          echo 'CONFIG_NF_FLOW_TABLE_PROCFS=y' >> $KCFG
          echo 'CONFIG_NET_RX_BUSY_POLL=y' >> $KCFG
          echo 'CONFIG_BQL=y' >> $KCFG
          echo '# CONFIG_DEBUG_KERNEL is not set' >> $KCFG
          echo '# CONFIG_DEBUG_FS is not set' >> $KCFG
          echo 'CONFIG_MEMCG=y' >> $KCFG
          echo 'CONFIG_TRANSPARENT_HUGEPAGE=y' >> $KCFG
          echo 'CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y' >> $KCFG
          echo 'CONFIG_PREEMPT=y' >> $KCFG
          echo 'CONFIG_PREEMPT_BUILD=y' >> $KCFG
          echo '# CONFIG_KASAN is not set' >> $KCFG
          echo '# CONFIG_KGDB is not set' >> $KCFG
          echo 'CONFIG_NET_GRO=y' >> $KCFG
          echo 'CONFIG_NET_GSO=y' >> $KCFG
          echo 'CONFIG_ZSWAP=y' >> $KCFG
          echo 'CONFIG_ZSWAP_COMPRESSOR_DEFAULT_LZ4=y' >> $KCFG
          echo 'CONFIG_ZRAM=y' >> $KCFG
          echo 'CONFIG_TCP_DEFAULT_WINDOW_SCALE=7' >> $KCFG
          echo 'CONFIG_NET_SOCK_MSG=y' >> $KCFG
          echo 'CONFIG_NET_FOU=y' >> $KCFG
          echo '# CONFIG_SOUND_OSS is not set' >> $KCFG
          echo '# CONFIG_AGP is not set' >> $KCFG
          echo 'CONFIG_NET_MEMCG=y' >> $KCFG

          # sysctl performance config 99‑performance.conf
          mkdir -p package/base-files/files/etc/sysctl.d
          SYSCTL=package/base-files/files/etc/sysctl.d/99-performance.conf
          > $SYSCTL
          echo "net.ipv4.tcp_keepalive_time = 600" >> $SYSCTL
          echo "net.ipv4.tcp_keepalive_intvl = 30" >> $SYSCTL
          echo "net.ipv4.tcp_keepalive_probes = 3" >> $SYSCTL
          echo "net.ipv4.tcp_syn_retries = 2" >> $SYSCTL
          echo "net.ipv4.tcp_synack_retries = 2" >> $SYSCTL
          echo "net.ipv4.tcp_fin_timeout = 30" >> $SYSCTL
          echo "net.ipv4.tcp_tw_reuse = 1" >> $SYSCTL
          echo "net.ipv4.tcp_max_tw_buckets = 20000" >> $SYSCTL
          echo "net.ipv4.tcp_max_syn_backlog = 8192" >> $SYSCTL
          echo "net.ipv4.tcp_window_scaling = 1" >> $SYSCTL
          echo "net.netfilter.nf_conntrack_max = 262144" >> $SYSCTL
          echo "net.netfilter.nf_conntrack_tcp_timeout_established = 3600" >> $SYSCTL
          echo "net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30" >> $SYSCTL
          echo "vm.swappiness = 10" >> $SYSCTL
          echo "vm.dirty_ratio = 10" >> $SYSCTL
          echo "vm.dirty_background_ratio = 5" >> $SYSCTL
          echo "net.core.busy_poll = 50" >> $SYSCTL
          echo "net.core.busy_read = 50" >> $SYSCTL
          echo "net.core.rmem_max = 16777216" >> $SYSCTL
          echo "net.core.wmem_max = 16777216" >> $SYSCTL
          echo "net.core.rmem_default = 262144" >> $SYSCTL
          echo "net.core.wmem_default = 262144" >> $SYSCTL
          echo "net.ipv4.tcp_moderate_rcvbuf = 1" >> $SYSCTL
          echo "net.ipv4.ip_local_port_range = 1024 65535" >> $SYSCTL
          echo "net.ipv4.tcp_sack = 1" >> $SYSCTL
          echo "net.ipv4.tcp_dsack = 1" >> $SYSCTL
          echo "net.ipv4.conf.all.accept_source_route = 0" >> $SYSCTL
          echo "net.ipv4.conf.default.accept_source_route = 0" >> $SYSCTL
          echo "net.ipv4.conf.all.send_redirects = 0" >> $SYSCTL
          echo "net.ipv4.conf.default.send_redirects = 0" >> $SYSCTL
          echo "net.netfilter.nf_flow_table_gc_interval = 1000" >> $SYSCTL
          echo "vm.pagecache_limit_mb = 1024" >> $SYSCTL
          echo "vm.vfs_cache_pressure = 50" >> $SYSCTL
          echo "net.ipv4.udp_mem = 8388608 12582912 16777216" >> $SYSCTL
          echo "net.ipv4.tcp_fastopen = 3" >> $SYSCTL
          echo "net.core.somaxconn = 4096" >> $SYSCTL
          echo "net.core.netdev_max_backlog = 16384" >> $SYSCTL
          echo "net.core.rmem_max = 33554432" >> $SYSCTL
          echo "net.core.wmem_max = 33554432" >> $SYSCTL
          echo "net.ipv4.tcp_max_syn_backlog = 16384" >> $SYSCTL
          echo "vm.dirty_expire_centisecs = 3000" >> $SYSCTL
          echo "vm.dirty_writeback_centisecs = 500" >> $SYSCTL
          echo "net.ipv4.conf.all.rp_filter = 1" >> $SYSCTL
          echo "net.ipv4.conf.default.rp_filter = 1" >> $SYSCTL
          echo "net.ipv4.icmp_echo_ignore_broadcasts = 1" >> $SYSCTL
          echo "net.ipv4.icmp_ignore_bogus_error_responses = 1" >> $SYSCTL

          # irqbalance_tune init.d
          mkdir -p package/base-files/files/etc/init.d
          IRQ=package/base-files/files/etc/init.d/irqbalance_tune
          > $IRQ
          echo '#!/bin/sh /etc/rc.common' >> $IRQ
          echo 'START=15' >> $IRQ
          echo 'start() {' >> $IRQ
          echo '    irqbalance --oneshot' >> $IRQ
          echo '}' >> $IRQ
          chmod +x $IRQ
          echo "/etc/init.d/irqbalance_tune enable" >> package/base-files/files/etc/rc.local

          # disk_tune init.d
          DISK=package/base-files/files/etc/init.d/disk_tune
          > $DISK
          echo '#!/bin/sh /etc/rc.common' >> $DISK
          echo 'START=16' >> $DISK
          echo 'start() {' >> $DISK
          echo '    mount -o remount,noatime /' >> $DISK
          echo '    mount -o remount,noatime /overlay' >> $DISK
          echo '    for disk in /sys/block/sd* /sys/block/nvme*;do' >> $DISK
          echo '      [ -e "$disk/queue/scheduler" ] && echo none > $disk/queue/scheduler' >> $DISK
          echo '    done' >> $DISK
          echo '    uci set system.@system[0].log_size="64"' >> $DISK
          echo '    uci set system.@system[0].log_proto="none"' >> $DISK
          echo '    uci set system.@system[0].cronfstrim_enabled="1"' >> $DISK
          echo '    uci set system.@system[0].cronfstrim_interval="weekly"' >> $DISK
          echo '    uci commit system' >> $DISK
          echo '}' >> $DISK
          chmod +x $DISK
          echo "/etc/init.d/disk_tune enable" >> package/base-files/files/etc/rc.local

          # rc.local disable unused service
          echo "/etc/init.d/umountd disable" >> package/base-files/files/etc/rc.local
          echo "/etc/init.d/sysntpd disable" >> package/base-files/files/etc/rc.local
          echo "/etc/init.d/dropbear disable; /etc/init.d/dropbear enable" >> package/base-files/files/etc/rc.local

          # modify config_generate: lan ip, timezone, hostname
          sed -i 's/192.168.1.1/192.168.5.1/g' package/base-files/files/bin/config_generate
          sed -i '/set system.@system\[0\].timezone/d' package/base-files/files/bin/config_generate
          echo 'set system.@system[0].timezone=CST-8' >> package/base-files/files/bin/config_generate
          echo 'set system.@system[0].zonename=Asia/Shanghai' >> package/base-files/files/bin/config_generate
          sed -i 's/OpenWrt/J4125-Router/g' package/base-files/files/bin/config_generate

          # write uhttpd config file, no heredoc
          mkdir -p package/base-files/files/etc/config
          UHTTPD=package/base-files/files/etc/config/uhttpd
          > $UHTTPD
          echo "config uhttpd 'main'" >> $UHTTPD
          echo "        list listen_http '0.0.0.0:80'" >> $UHTTPD
          echo "        list listen_http '[::]:80'" >> $UHTTPD
          echo "        list listen_https '0.0.0.0:443'" >> $UHTTPD
          echo "        list listen_https '[::]:443'" >> $UHTTPD
          echo "        option redirect_https '0'" >> $UHTTPD
          echo "        option home '/www'" >> $UHTTPD
          echo "        option rfc1918_filter '1'" >> $UHTTPD
          echo "        option max_requests '32'" >> $UHTTPD
          echo "        option max_keepalive '60'" >> $UHTTPD
          echo "        option http_timeout '120'" >> $UHTTPD
          echo "        option cert '/etc/uhttpd.crt'" >> $UHTTPD
          echo "        option key '/etc/uhttpd.key'" >> $UHTTPD
          echo "        option cgi_prefix '/cgi-bin'" >> $UHTTPD
          echo "        list lua_prefix '/cgi-bin/luci'" >> $UHTTPD
          echo "        list lua_handler '/usr/lib/lua/luci/sgi/uhttpd.lua'" >> $UHTTPD
          echo "        option script_timeout '60'" >> $UHTTPD
          echo "        option network_timeout '30'" >> $UHTTPD
          echo "        option tcp_keepalive '1'" >> $UHTTPD

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a || ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add third‑party packages
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall package/openwrt-passwall
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/openwrt-passwall-packages
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon package/luci-theme-argon
          git clone --depth 1 https://github.com/rufengsuixing/luci-app-adguardhome package/luci-app-adguardhome

      - name: Generate .config
        run: |
          cd openwrt
          make defconfig
          echo 'CONFIG_TARGET_x86=y' >> .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_Generic=y' >> .config
          echo 'CONFIG_TARGET_IMAGES_GZIP=y' >> .config
          echo 'CONFIG_TARGET_IMAGES_COMBINED_EFI=y' >> .config
          echo 'CONFIG_TARGET_IMAGES_COMBINED_VMDK=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-net-igc=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-igc=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-core=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-xhci=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-sound-hda-intel=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-i915=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-i2c-i801=y' >> .config
          echo 'CONFIG_PACKAGE_ipv6helper=y' >> .config
          echo 'CONFIG_PACKAGE_odhcpd-ipv6=y' >> .config
          echo 'CONFIG_PACKAGE_6in4=y' >> .config
          echo 'CONFIG_PACKAGE_6rd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-proto-dhcpv6=y' >> .config
          echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-offload=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-flow-offload=y' >> .config
          echo 'CONFIG_PACKAGE_cpufrequtils=y' >> .config
          echo 'CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y' >> .config
          echo 'CONFIG_PACKAGE_irqbalance=y' >> .config
          echo '# CONFIG_PACKAGE_odhcpd-ipv6only is not set' >> .config
          echo '# CONFIG_PACKAGE_ppp is not set' >> .config
          echo '# CONFIG_PACKAGE_pppoe-discovery is not set' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-adguardhome=y' >> .config
          echo 'CONFIG_PACKAGE_adguardhome=y' >> .config
          echo 'CONFIG_PACKAGE_sqm-scripts=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-sqm=y' >> .config
          echo 'CONFIG_PACKAGE_iperf3=y' >> .config
          echo 'CONFIG_PACKAGE_tcpdump=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_wget-ssl=y' >> .config
          echo 'CONFIG_PACKAGE_nload=y' >> .config
          echo 'CONFIG_PACKAGE_htop=y' >> .config
          make oldconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make clean
          make -j2 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-J4125-firmware
          path: |
            openwrt/bin/targets/x86/64/*.gz
            openwrt/bin/targets/x86/64/*.vmdk
