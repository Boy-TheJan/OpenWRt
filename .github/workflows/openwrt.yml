name: OpenWrt‑Main‑x86_64‑PureOfficial
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install compile dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt‑get update
          sudo apt‑get install -y build‑essential flex bison gawk git python3 python3‑pip unzip libncurses‑dev libssl‑dev zlib1g‑dev file wget curl rsync libelf‑dev

      - name: Clone pure official OpenWrt main
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout main
          # 完全保留原始官方feeds.conf.default，不追加任何第三方源
          ./scripts/feeds update -a

      - name: Feeds install official packages only
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Generate .config x86_64 + IPv6 + 中文LuCI
        run: |
          cd openwrt
          make defconfig
          cat > .config <<'EOF'
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y

# 完整IPv6支持（全部官方包）
CONFIG_IPV6=y
CONFIG_PACKAGE_ip6tables=y
CONFIG_PACKAGE_ip6tables‑nat=y
CONFIG_PACKAGE_odhcpd‑full=y
CONFIG_PACKAGE_dnsmasq‑full=y
CONFIG_PACKAGE_6in4=y
CONFIG_PACKAGE_ipv6‑helper=y
CONFIG_PACKAGE_luci‑proto‑ipv6=y

# LuCI 官方Bootstrap主题 + 简体中文语言包
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci‑i18n‑zh‑cn=y
CONFIG_PACKAGE_luci‑theme‑bootstrap=y

# 基础运维工具
CONFIG_PACKAGE_openssh‑server=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget=y
CONFIG_PACKAGE_tcpdump=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_iperf3=y

CONFIG_IMAGEOPT=y
CONFIG_IB=n
CONFIG_SDK=n
CONFIG_DEVEL=n
EOF
          make oldconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload‑artifact@v4
        with:
          name: openwrt‑main‑x8664‑100percent‑official
          path: openwrt/bin/targets/x86/64/*.img*
          retention‑days: 7
