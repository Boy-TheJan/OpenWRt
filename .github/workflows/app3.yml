name: Build OpenWrt MAIN J4125 UltimatePerf
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  OPENWRT_BRANCH: main
  FIRMWARE_TAG: MAIN-J4125-I225V-UltimatePerf
  CI_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ binutils flex bison gawk autoconf automake libtool ccache libncurses-dev git curl wget unzip rsync python3-pip python3-setuptools libssl-dev qemu-utils

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch ${{ env.OPENWRT_BRANCH }} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          cp feeds.conf.default feeds.conf

      - name: Custom source modification & Ultimate full performance tuning
        run: |
          cd openwrt
          echo "===== Start ultimate full performance tuning ====="

          # -------------------------- Kernel config target/linux/x86/config-6.6 --------------------------
          echo 'CONFIG_TCP_CONG_BBR=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> target/linux/x86/config-6.6
          echo 'CONFIG_TCP_FASTOPEN=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_VM_SWAPPINESS=10' >> target/linux/x86/config-6.6
          echo 'CONFIG_NF_FLOW_TABLE=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_NF_FLOW_TABLE_PROCFS=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_NET_RX_BUSY_POLL=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_BQL=y' >> target/linux/x86/config-6.6
          echo '# CONFIG_DEBUG_KERNEL is not set' >> target/linux/x86/config-6.6
          echo '# CONFIG_DEBUG_FS is not set' >> target/linux/x86/config-6.6
          echo 'CONFIG_MEMCG=y' >> target/linux/x86/config-6.6

          echo 'CONFIG_TRANSPARENT_HUGEPAGE=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_PREEMPT=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_PREEMPT_BUILD=y' >> target/linux/x86/config-6.6
          echo '# CONFIG_KASAN is not set' >> target/linux/x86/config-6.6
          echo '# CONFIG_KGDB is not set' >> target/linux/x86/config-6.6
          echo 'CONFIG_NET_GRO=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_NET_GSO=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_ZSWAP=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_ZSWAP_COMPRESSOR_DEFAULT_LZ4=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_ZRAM=y' >> target/linux/x86/config-6.6

          # Append extra kernel optimize
          echo 'CONFIG_TCP_DEFAULT_WINDOW_SCALE=7' >> target/linux/x86/config-6.6
          echo 'CONFIG_NET_SOCK_MSG=y' >> target/linux/x86/config-6.6
          echo 'CONFIG_NET_FOU=y' >> target/linux/x86/config-6.6
          echo '# CONFIG_SOUND_OSS is not set' >> target/linux/x86/config-6.6
          echo '# CONFIG_AGP is not set' >> target/linux/x86/config-6.6
          echo 'CONFIG_NET_MEMCG=y' >> target/linux/x86/config-6.6

          # -------------------------- sysctl 99-performance.conf --------------------------
          mkdir -p package/base-files/files/etc/sysctl.d
          cat > package/base-files/files/etc/sysctl.d/99-performance.conf <<'EOF'
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 20000
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_window_scaling = 1
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
net.core.busy_poll = 50
net.core.busy_read = 50
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144

net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.netfilter.nf_flow_table_gc_interval = 1000
vm.pagecache_limit_mb = 1024
vm.vfs_cache_pressure = 50
net.ipv4.udp_mem = 8388608 12582912 16777216

net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_max_syn_backlog = 16384
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
EOF

          # -------------------------- IRQ balance init script --------------------------
          mkdir -p package/base-files/files/etc/init.d
          cat > package/base-files/files/etc/init.d/irqbalance_tune <<'EOF'
#!/bin/sh /etc/rc.common
START=15
start() {
    irqbalance --oneshot
}
EOF
          chmod +x package/base-files/files/etc/init.d/irqbalance_tune
          echo "/etc/init.d/irqbalance_tune enable" >> package/base-files/files/etc/rc.local

          # -------------------------- Disk IO & SSD fstrim tune init script --------------------------
          cat > package/base-files/files/etc/init.d/disk_tune <<'EOF'
#!/bin/sh /etc/rc.common
START=16
start() {
    mount -o remount,noatime /
    mount -o remount,noatime /overlay
    for disk in /sys/block/sd* /sys/block/nvme*;do
        [ -e "$disk/queue/scheduler" ] && echo none > $disk/queue/scheduler
    done
    uci set system.@system[0].log_size='64'
    uci set system.@system[0].log_proto='none'
    uci set system.@system[0].cronfstrim_enabled='1'
    uci set system.@system[0].cronfstrim_interval='weekly'
    uci commit system
}
EOF
          chmod +x package/base-files/files/etc/init.d/disk_tune
          echo "/etc/init.d/disk_tune enable" >> package/base-files/files/etc/rc.local

          # -------------------------- System rc.local disable unused service --------------------------
          echo "/etc/init.d/umountd disable" >> package/base-files/files/etc/rc.local
          echo "/etc/init.d/sysntpd disable" >> package/base-files/files/etc/rc.local
          echo "/etc/init.d/dropbear disable; /etc/init.d/dropbear enable" >> package/base-files/files/etc/rc.local

          # -------------------------- Base network config: LAN IP / Timezone / Hostname --------------------------
          sed -i 's/192.168.1.1/192.168.5.1/g' package/base-files/files/bin/config_generate
          sed -i '/set system.@system\[0\].timezone/d' package/base-files/files/bin/config_generate
          echo 'set system.@system[0].timezone=CST-8' >> package/base-files/files/bin/config_generate
          echo 'set system.@system[0].zonename=Asia/Shanghai' >> package/base-files/files/bin/config_generate
          sed -i 's/OpenWrt/J4125-Router/g' package/base-files/files/bin/config_generate

          echo "===== Ultimate full performance tuning done ====="

      - name: Feeds update with retry
        run: |
          cd openwrt
          ./scripts/feeds update -a || ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add third‑party packages
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall package/openwrt-passwall
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/openwrt-passwall-packages
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon package/luci-theme-argon
          git clone --depth 1 https://github.com/rufengsuixing/luci-app-adguardhome package/luci-app-adguardhome

      - name: LuCI Lua GC & uhttpd connection tune
        run: |
          cd openwrt
          sed -i 's/collectgarbage(20)/collectgarbage(80)/g' feeds/luci/modules/luci-base/ucode/rpc.lua
          sed -i 's/max_requests=10/max_requests=32/g' feeds/luci/modules/luci-base/files/uhttpd.config
          sed -i 's/max_keepalive=20/max_keepalive=60/g' feeds/luci/modules/luci-base/files/uhttpd.config
          sed -i 's/http_timeout=300/http_timeout=120/g' feeds/luci/modules/luci-base/files/uhttpd.config

      - name: Generate .config
        run: |
          cd openwrt
          make defconfig
          echo 'CONFIG_TARGET_x86=y' >> .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_Generic=y' >> .config
          echo 'CONFIG_TARGET_IMAGES_GZIP=y' >> .config
          echo 'CONFIG_TARGET_IMAGES_COMBINED_EFI=y' >> .config
          echo 'CONFIG_TARGET_IMAGES_COMBINED_VMDK=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-net-igc=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-igc=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-usb-core=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-xhci=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-sound-hda-intel=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-i915=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-i2c-i801=y' >> .config

          echo 'CONFIG_PACKAGE_ipv6helper=y' >> .config
          echo 'CONFIG_PACKAGE_odhcpd-ipv6=y' >> .config
          echo 'CONFIG_PACKAGE_6in4=y' >> .config
          echo 'CONFIG_PACKAGE_6rd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-proto-dhcpv6=y' >> .config
          echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-nft-offload=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-flow-offload=y' >> .config
          echo 'CONFIG_PACKAGE_cpufrequtils=y' >> .config
          echo 'CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y' >> .config
          echo 'CONFIG_PACKAGE_irqbalance=y' >> .config

          echo '# CONFIG_PACKAGE_odhcpd-ipv6only is not set' >> .config
          echo '# CONFIG_PACKAGE_ppp is not set' >> .config
          echo '# CONFIG_PACKAGE_pppoe-discovery is not set' >> .config

          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall=y' >> .config

          # AdGuardHome ad block & dns accelerate
          echo 'CONFIG_PACKAGE_luci-app-adguardhome=y' >> .config
          echo 'CONFIG_PACKAGE_adguardhome=y' >> .config

          # SQM QoS anti‑bufferbloat
          echo 'CONFIG_PACKAGE_sqm-scripts=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-sqm=y' >> .config

          echo 'CONFIG_PACKAGE_iperf3=y' >> .config
          echo 'CONFIG_PACKAGE_tcpdump=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_wget-ssl=y' >> .config
          echo 'CONFIG_PACKAGE_nload=y' >> .config
          echo 'CONFIG_PACKAGE_htop=y' >> .config

          make oldconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_TAG }}
          path: |
            openwrt/bin/targets/x86/64/*.gz
            openwrt/bin/targets/x86/64/*.vmdk
