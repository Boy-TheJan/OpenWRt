name: Build OpenWrt Main x86_64
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  OPENWRT_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库配置文件
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget curl unzip libssl-dev rsync python3-pip ca-certificates

      - name: 克隆OpenWrt源码（3次重试）
        run: |
          set -x
          retry_git() {
            for i in {1..3}; do
              git clone https://github.com/openwrt/openwrt.git openwrt && return 0
              echo "克隆失败，等待40s重试 第$i次"
              sleep 40
            done
            echo "源码克隆彻底失败"
            exit 1
          }
          retry_git
          cd openwrt
          git checkout ${{ env.OPENWRT_BRANCH }}

      - name: 复制配置、统一换行符LF
        run: |
          set -x
          cp -f .config openwrt/
          cp -f diy.sh openwrt/
          chmod +x openwrt/diy.sh
          sed -i 's/\r$//' openwrt/diy.sh
          ls -lh openwrt/

      - name: 执行 diy.sh
        run: |
          set -x
          cd openwrt
          ./diy.sh 2>&1 | tee build_diy.log

      - name: 预下载源码包
        run: |
          set -x
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          set -x
          cd openwrt
          make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64-ext4
          path: openwrt/bin/targets/x86/64/*.img

      - name: 上传DIY运行日志（排错必备）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: openwrt/build_diy.log
