name: Build OpenWrt Main x86_64
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  OPENWRT_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库配置文件
        uses: actions/checkout@v4

      - name: 修复DNS + 安装依赖
        run: |
          set -x
          # 更换公共DNS防止解析失败
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget curl unzip libssl-dev rsync python3-pip ca-certificates

      - name: 拉取OpenWrt源码（增加重试3次）
        run: |
          set -x
          for i in {1..3}; do
            git clone https://github.com/openwrt/openwrt.git openwrt && break
            echo "克隆失败，等待30s重试，第$i次"
            sleep 30
          done
          cd openwrt
          git checkout ${{ env.OPENWRT_BRANCH }}

      - name: 复制配置与脚本，修复换行符
        run: |
          set -x
          cp -f .config openwrt/
          cp -f diy.sh openwrt/
          chmod +x openwrt/diy.sh
          sed -i 's/\r$//' openwrt/diy.sh

      - name: 执行DIY初始化脚本
        run: |
          set -x
          cd openwrt
          ./diy.sh

      - name: 预下载软件包
        run: |
          set -x
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          set -x
          cd openwrt
          make -j$(nproc)

      - name: 上传固件成品
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64-ext4
          path: openwrt/bin/targets/x86/64/*.img
